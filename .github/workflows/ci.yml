name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pharmaflow_test
          POSTGRES_USER: pharmaflow
          POSTGRES_PASSWORD: pharmaflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pharmaflow"
          --health-interval 5s --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Tests
        env:
          PF_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://pharmaflow:pharmaflow@localhost:5432/pharmaflow_test' || 'sqlite://' }}
        run: pytest -v

  hmi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck and build HMI
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test, hmi]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (HMI + API)
        run: docker build -t pharmaflow .
